name: Generate Contribution Snake

on:
  # Regenerate the contribution animation every day.
  schedule:
    - cron: "0 0 * * *"

  # Allow the workflow to be started manually from the Actions tab.
  workflow_dispatch:

  # Refresh the animation whenever the profile README is updated.
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/snake.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Vishnudharshan-33
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
